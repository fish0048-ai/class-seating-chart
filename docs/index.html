<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#1b3a4b" />
    <title>班級座位表</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">座</span>
          <div>
            <h1>班級座位表</h1>
            <p id="syncMeta">正在載入…</p>
          </div>
        </div>
        <label class="class-picker">
          <span>班級</span>
          <select id="classSelect" aria-label="選擇班級"></select>
        </label>
      </header>

      <nav class="toolbar" aria-label="主要操作">
        <button type="button" class="tool" data-mode="plus" id="btnPlus">加分</button>
        <button type="button" class="tool" data-mode="minus" id="btnMinus">扣分</button>
        <div class="delta-group" role="group" aria-label="分數幅度">
          <button type="button" class="chip" data-delta="1">1</button>
          <button type="button" class="chip" data-delta="2">2</button>
          <button type="button" class="chip" data-delta="5">5</button>
        </div>
        <button type="button" class="tool" id="btnUndo">復原</button>
        <button type="button" class="tool accent" id="btnLottery">抽籤</button>
        <button type="button" class="tool" id="btnUpload">上傳名單</button>
        <button type="button" class="tool" id="btnExport">下載備份</button>
        <button type="button" class="tool" id="btnImport">還原備份</button>
        <button type="button" class="tool primary" id="btnSave">存檔</button>
        <button type="button" class="tool" id="btnSettings">設定</button>
        <input id="backupFile" type="file" accept=".json,application/json" hidden />
      </nav>

      <main class="stage">
        <section class="board-wrap">
          <div class="blackboard">講台／黑板</div>
          <div id="board" class="board" aria-label="座位表"></div>
        </section>
        <aside class="side">
          <h2>本班學生</h2>
          <p class="hint">資料會自動存在這個瀏覽器。可上傳 CSV／Excel，或下載備份拿到其他電腦還原。</p>
          <ol id="roster" class="roster"></ol>
        </aside>
      </main>
    </div>

    <div id="toast" class="toast" hidden></div>

    <div id="lotteryModal" class="modal" hidden>
      <div class="modal-card lottery-card">
        <p class="modal-kicker">隨機抽籤</p>
        <div id="lotteryName" class="lottery-name">？</div>
        <p id="lotteryMeta" class="lottery-meta">準備抽出一位同學</p>
        <label class="check">
          <input type="checkbox" id="lotteryUnique" checked />
          本堂不重複抽過的人
        </label>
        <div class="modal-actions">
          <button type="button" class="tool" id="btnLotteryReset">重置名單</button>
          <button type="button" class="tool" id="btnLotteryClose">關閉</button>
          <button type="button" class="tool primary" id="btnLotteryAgain">再抽一次</button>
        </div>
      </div>
    </div>

    <div id="settingsModal" class="modal" hidden>
      <div class="modal-card settings-card">
        <h2>班級設定與學生名單</h2>
        <p class="hint">上傳 CSV／Excel，或直接貼上。儲存後立刻可用。</p>
        <div class="form-grid">
          <label>班級名稱
            <input id="settingClassName" type="text" maxlength="40" placeholder="例如 301" />
          </label>
          <label>列數
            <input id="settingRows" type="number" min="1" max="20" />
          </label>
          <label>欄數
            <input id="settingCols" type="number" min="1" max="16" />
          </label>
        </div>
        <div id="uploadBox" class="upload-box">
          <input id="settingFile" type="file" accept=".csv,.txt,.xlsx,.xls" hidden />
          <p><strong>把名單檔拖到這裡</strong>，或 <button type="button" class="linkish" id="btnPickFile">選擇檔案</button></p>
          <p class="hint">欄位：班級、座號、姓名（分數可有可無）。Excel 請用第一個工作表。</p>
          <p><a href="學生名單範本.csv" download>下載 CSV 範本</a></p>
          <p id="uploadPreview" class="upload-preview" hidden></p>
        </div>
        <label class="check left">
          <input type="checkbox" id="settingReplace" />
          覆蓋這些班級的舊名單（沒出現的座號會刪除）
        </label>
        <label>或直接貼上（每行：座號,姓名 或 班級,座號,姓名）
          <textarea id="settingStudents" rows="8" placeholder="301,01,陳安安&#10;301,02,林冠宇"></textarea>
        </label>
        <div class="modal-actions">
          <button type="button" class="tool" id="btnExportCsv">下載本班 CSV</button>
          <button type="button" class="tool" id="btnSettingsClose">取消</button>
          <button type="button" class="tool primary" id="btnSettingsSave">儲存</button>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="api.js"></script>
    <script src="app.js"></script>
  </body>
</html>
